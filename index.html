<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d6b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tranås Sortering"><link rel="manifest" href="manifest.json"><title>Tranås Sortering 4.1.3</title><style>
:root{--green:#1d6b45;--bg:#f5f6f4;--card:#fff;--text:#18201c;--muted:#66706b;--warn:#8a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--text)}header{background:var(--green);color:white;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;position:sticky;top:0;z-index:5}h1{font-size:24px;margin:0 0 4px}.sub{opacity:.9;font-size:13px;margin-bottom:11px}.search{width:100%;border:0;border-radius:14px;padding:14px 15px;font-size:17px;outline:none}.hint{font-size:12px;opacity:.9;margin-top:8px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 11px}.tab{border:0;border-radius:999px;padding:9px 12px;background:#e5e9e5;color:#25312a;white-space:nowrap}.tab.active{background:var(--green);color:white}main{max-width:760px;margin:auto;padding:13px 13px 90px}.card{background:var(--card);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #0000000d;display:flex;gap:12px;align-items:flex-start}.icon{font-size:27px}.name{font-weight:750;font-size:17px}.cat{font-size:13px;color:var(--green);font-weight:700;margin-top:3px}.note{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.38}.star{margin-left:auto;border:0;background:none;font-size:22px}.score{font-size:11px;color:#8a938e;margin-top:5px}.section{font-size:19px;font-weight:800;margin:17px 3px 8px}.info{background:#fff;border-radius:17px;padding:16px;margin:9px 0;line-height:1.45}.info h2{margin:0 0 8px;font-size:18px}.amb{border-left:4px solid #c88a16}.empty{text-align:center;color:var(--muted);padding:35px 15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:8px 10px;background:#e8ece8}.top{display:flex;justify-content:space-between;align-items:center}.clear{border:0;background:none;color:white;font-size:14px}a{color:var(--green);font-weight:700}footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #ddd;padding:9px 13px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted)}
</style></head><body><header><div class="top"><div><h1>♻️ Tranås Sortering</h1><div class="sub">4.1.4 · smart sökning · 500+ saker · förbättrad kamera + OCR · offline</div></div><div><button class="clear" onclick="startCamera()">📷 Kamera</button> <button class="clear" onclick="clearSearch()">Rensa</button></div></div><input id="q" class="search" autocomplete="off" placeholder="Skriv t.ex. Latz, folie, kartong eller kattbajs"><div class="hint">Söker även på vardagsord, synonymer och vanliga stavfel.</div></header><div id="cam" style="display:none;position:fixed;inset:0;background:#000;z-index:20;padding:env(safe-area-inset-top) 12px 20px"><div style="display:flex;justify-content:space-between;align-items:center;color:#fff;padding:10px 0"><b>📷 Läs av förpackning</b><button class="clear" onclick="stopCamera()">Stäng</button></div><video id="video" autoplay playsinline style="width:100%;max-height:62vh;object-fit:cover;border-radius:16px;background:#111"></video><canvas id="canvas" style="display:none"></canvas><button id="snap" onclick="captureAndRead()" style="width:100%;margin-top:14px;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:700">📸 Ta bild och sök</button><div id="camStatus" style="color:#fff;text-align:center;margin-top:12px;font-size:14px"></div><div id="ocrRead" style="display:none;color:#fff;background:#ffffff18;border-radius:12px;padding:10px;margin-top:10px;font-size:13px;line-height:1.35"></div><div style="color:#ccc;text-align:center;font-size:12px;margin-top:10px">Tips: håll etiketten nära, rak och väl belyst.</div></div><main><div id="ocrResult" style="display:none" class="info"></div><div class="tabs" id="tabs"></div><div id="content"></div></main><footer>Tranås Sortering 4.1.4 · <a href="https://tranas.se/bo-miljo-och-trafik/avfall-och-atervinning/sorteringsguiden/" target="_blank">Officiell sorteringsguide</a></footer><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
let stream=null;
let all=[],fav=new Set(JSON.parse(localStorage.getItem('fav4')||'[]')),recent=JSON.parse(localStorage.getItem('recent4')||'[]');let active='Alla';
const cats=[['Alla','♻️'],['Matavfall','🟫'],['Restavfall','⚫'],['Plastförpackning','🟨'],['Pappersförpackning','🟦'],['Metallförpackning','🟥'],['Glasförpackning','🟩'],['Tidningar','📰'],['Elektronik','🔌'],['Farligt avfall','☣️'],['Pant','💰'],['Textil/återbruk','👕'],['Norraby ÅVC','♻️'],['Apotek','💊'],['Beror på','❓']];
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9åäö ]/gi,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let nd=[i];for(let j=1;j<=b.length;j++)nd[j]=Math.min(nd[j-1]+1,d[j]+1,d[j-1]+(a[i-1]===b[j-1]?0:1));d=nd}return d[b.length]}
function score(x,q){const nq=norm(q);if(!nq)return 1;const qs=nq.split(' ').filter(t=>t.length>=2);let best=0;for(const v of [x.name,x.category,...(x.aliases||[])]){const nv=norm(v);if(!nv)continue;if(nv===nq)best=Math.max(best,1000);if(nv.includes(nq))best=Math.max(best,180);for(const qt of qs){for(const t of nv.split(' ')){if(t===qt)best=Math.max(best,170);else if(t.startsWith(qt))best=Math.max(best,145);else if(qt.length>=4&&lev(qt,t)<=1)best=Math.max(best,120);else if(t.includes(qt)&&qt.length>=3)best=Math.max(best,110)}}}return best}
async function init(){all=await fetch('data.json').then(r=>r.json());renderTabs();render()}
function renderTabs(){tabs.innerHTML=cats.map(c=>`<button class="tab ${c[0]===active?'active':''}" onclick="active='${c[0]}';renderTabs();render()">${c[1]} ${c[0]}</button>`).join('')}
function toggleFav(i){let k=all[i].name;fav.has(k)?fav.delete(k):fav.add(k);localStorage.setItem('fav4',JSON.stringify([...fav]));render()}
function clearSearch(){q.value='';render()}
async function startCamera(){try{cam.style.display='block';camStatus.textContent='Startar kamera…';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;camStatus.textContent='Rikta kameran mot texten på förpackningen.'}catch(e){camStatus.textContent='Kameran kunde inte startas. Kontrollera kameratillståndet i Safari.'}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;cam.style.display='none';camStatus.textContent=''}
function preprocess(src,opts={}){const w=src.width,h=src.height;const crop=opts.crop??1,scale=opts.scale??2,mode=opts.mode??'gray',xoff=opts.xoff??.5,yoff=opts.yoff??.5;const cw=Math.round(w*crop),ch=Math.round(h*crop),sx=Math.max(0,Math.round((w-cw)*xoff)),sy=Math.max(0,Math.round((h-ch)*yoff));const c=document.createElement('canvas');c.width=Math.round(cw*scale);c.height=Math.round(ch*scale);const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingEnabled=true;g.drawImage(src,sx,sy,cw,ch,0,0,c.width,c.height);const img=g.getImageData(0,0,c.width,c.height),d=img.data;for(let i=0;i<d.length;i+=4){let lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(mode==='contrast')lum=Math.max(0,Math.min(255,(lum-128)*1.9+128));if(mode==='bw')lum=lum>155?255:0;if(mode==='softbw'){lum=Math.max(0,Math.min(255,(lum-128)*1.35+128));lum=lum>145?255:0}d[i]=d[i+1]=d[i+2]=lum}g.putImageData(img,0,0);return c}
function cleanOCR(text){return text.replace(/[|{}\[\]<>*_~`\\]/g,' ').replace(/\s+/g,' ').trim()}
function usefulOCR(text){const t=cleanOCR(text);return t.split(/\s+/).filter(w=>{const z=norm(w);return z.length>=2 && !/^\d+$/.test(z) && !/^[^a-zåäö]+$/i.test(z)}).join(' ')}
function ocrCandidates(text){const words=usefulOCR(text).split(/\s+/).filter(Boolean);const joined=words.join(' ');return [...new Set([joined,...words].filter(x=>x.length>=2))]}
function bestOCRQuery(text){const candidates=ocrCandidates(text);let best='',bestScore=-1;for(const cand of candidates){const n=norm(cand);let s=0;if(n.length>=4)s+=10;if(/[a-zåäö]/i.test(cand))s+=5;if(cand.split(/\s+/).length===1)s+=3;if(n.length>18)s-=8;if(s>bestScore){bestScore=s;best=cand}}return best||cleanOCR(text).slice(0,80)}
async function captureAndRead(){if(!stream)return;const w=video.videoWidth,h=video.videoHeight;if(!w||!h){camStatus.textContent='Kameran är inte redo ännu.';return}canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,w,h);camStatus.textContent='Förbereder bilden…';snap.disabled=true;try{const images=[
 preprocess(canvas,{crop:.96,scale:2.2,mode:'gray'}),
 preprocess(canvas,{crop:.82,scale:2.8,mode:'contrast'}),
 preprocess(canvas,{crop:.72,scale:3.0,mode:'gray',xoff:.5,yoff:.38}),
 preprocess(canvas,{crop:.72,scale:3.0,mode:'gray',xoff:.5,yoff:.62}),
 preprocess(canvas,{crop:.82,scale:2.6,mode:'softbw'})
 ];let texts=[];for(let i=0;i<images.length;i++){camStatus.textContent='Läser text… '+(i+1)+' / '+images.length;const configs=[6,6,11,11,6];const r=await Tesseract.recognize(images[i],'swe+eng',{logger:m=>{if(m.status==='recognizing text'&&m.progress)camStatus.textContent='Läser text… '+(i+1)+' / '+images.length+' · '+Math.round(m.progress*100)+'%'}}, {tessedit_pageseg_mode:String(configs[i]),preserve_interword_spaces:'1'});if(r?.data?.text)texts.push(r.data.text)}const clean=usefulOCR(texts.join(' '));const query=bestOCRQuery(clean);stopCamera();ocrResult.style.display='block';ocrResult.innerHTML=clean?('<b>📖 Kameran läste:</b><br>'+esc(clean.slice(0,260))+'<br><br><b>🔎 Söker på:</b> '+esc(query)+'<br><small>Om träffen blir fel kan du ändra sökordet direkt.</small>'):'<b>📖 Kameran kunde inte läsa tydlig text.</b><br>Prova närmare, håll texten rak och fyll bilden med etiketten.';q.value=query;render();}catch(e){stopCamera();ocrResult.style.display='block';ocrResult.innerHTML='<b>📖 OCR-fel:</b> '+esc(e?.message||'okänt fel')+'<br>Försök igen med bättre ljus och närmare avstånd.'}finally{snap.disabled=false}}
function render(){let query=q.value.trim();let nq=norm(query);let arr=all.map((x,i)=>({...x,i,s:query?score(x,query):1})).filter(x=>(active==='Alla'||x.category===active)&&(!query||x.s>0)).sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name,'sv'));content.innerHTML='';
 if(!query&&active==='Alla'){content.innerHTML=`<div class="info"><h2>Snabbsök</h2><div>Testa <b>Latz</b>, <b>kattmat</b>, <b>folie</b>, <b>kartong</b>, <b>kvitto</b>, <b>batteri</b> eller <b>julklappspapper</b>.</div></div>${recent.length?`<div class="section">Senaste sökningar</div><div class="info chips">${recent.map(r=>`<button class="chip" onclick="q.value='${esc(r)}';render()">${esc(r)}</button>`).join('')}</div>`:''}<div class="info"><h2>📌 Viktig grundregel</h2><div>Det är bara <b>förpackningar</b> som ska till förpackningsfraktionerna. För en förpackning som består av flera material: sortera efter materialet den är mest av.</div></div><div class="info"><h2>♻️ Norraby ÅVC</h2><div>Tar bland annat emot grovavfall, trädgårdsavfall, elavfall och farligt avfall.</div><p><b>Ordinarie:</b> Mån 08–19 · Tis 07–16 · Ons 07–16 · Tor 08–19 · Fre 07–16 · Lör 08–15 · Sön stängt</p></div><div class="info"><h2>🛢️ Miljötratten</h2><div>Samla flytande matfett/matolja i ren PET-flaska med Miljötratten och lämna enligt kommunens anvisning.</div></div>`;return}
 if(query){recent=[query,...recent.filter(x=>x.toLowerCase()!==query.toLowerCase())].slice(0,8);localStorage.setItem('recent4',JSON.stringify(recent))}
 if(!arr.length){content.innerHTML='<div class="empty"><b>Hittade inget.</b><br>Prova ett kortare ord, synonym eller vardagsnamn.</div>';return}
 const top=arr.slice(0,40);content.innerHTML=top.map(x=>`<div class="card ${x.category==='Beror på'?'amb':''}"><div class="icon">${x.icon}</div><div style="flex:1"><div class="name">${esc(x.name)}</div><div class="cat">${esc(x.category)}</div><div class="note">${esc(x.note)}</div>${x.category==='Beror på'&&x.alternatives?'<div class="note"><b>Här behöver du kontrollera materialet.</b></div>':''}</div><button class="star" onclick="toggleFav(${x.i})">${fav.has(x.name)?'⭐':'☆'}</button></div>`).join('')+(arr.length>40?`<div class="empty">Visar de 40 bästa träffarna av ${arr.length}.</div>`:'')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}q.addEventListener('input',render);init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
