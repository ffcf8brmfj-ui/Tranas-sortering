<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d6b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tranås Sortering"><link rel="manifest" href="manifest.json"><title>Tranås Sortering 5.0</title>
<style>
:root{--green:#1d6b45;--bg:#f5f6f4;--card:#fff;--text:#18201c;--muted:#66706b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--text)}header{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;position:sticky;top:0;z-index:5}h1{font-size:24px;margin:0 0 4px}.sub{opacity:.92;font-size:13px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.actions{display:flex;gap:6px}.clear{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:12px;padding:9px 10px;font-size:13px;font-weight:700}.search{width:100%;border:0;border-radius:14px;padding:14px 15px;font-size:17px;outline:none}.hint{font-size:12px;opacity:.9;margin-top:8px}.modebar{max-width:760px;margin:12px auto 0;padding:0 13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{border:0;border-radius:16px;padding:14px;background:#fff;font-size:16px;font-weight:800;color:var(--green);box-shadow:0 1px 4px #00000010}.mode small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.barcode{display:none;position:fixed;inset:0;background:#000;z-index:30;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 18px);color:#fff}.barhead{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.reader{width:100%;max-width:760px;margin:12px auto;border-radius:16px;overflow:hidden;background:#111}.barstatus{text-align:center;margin:14px;font-size:14px;line-height:1.4}.closebar{display:block;margin:18px auto;border:0;border-radius:14px;padding:13px 22px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 11px}.tab{border:0;border-radius:999px;padding:9px 12px;background:#e5e9e5;color:#25312a;white-space:nowrap}.tab.active{background:var(--green);color:#fff}main{max-width:760px;margin:auto;padding:0 13px 90px}.card,.info{background:var(--card);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #0000000d}.card{display:flex;gap:12px;align-items:flex-start}.icon{font-size:27px}.name{font-weight:750;font-size:17px}.cat{font-size:13px;color:var(--green);font-weight:700;margin-top:3px}.note{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.38}.star{margin-left:auto;border:0;background:none;font-size:22px}.section{font-size:19px;font-weight:800;margin:17px 3px 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:8px 10px;background:#e8ece8}.empty{text-align:center;color:var(--muted);padding:35px 15px}.amb{border-left:4px solid #c88a16}a{color:var(--green);font-weight:700}footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #ddd;padding:9px 13px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted)}
</style></head><body>
<header><div class="top"><div><h1>♻️ Tranås Sortering</h1><div class="sub">5.0 · smart textsökning · 600+ saker · streckkod · offline</div></div><div class="actions"><button class="clear" onclick="startBarcode()">▣ Streckkod</button><button class="clear" onclick="clearSearch()">Rensa</button></div></div><input id="q" class="search" autocomplete="off" placeholder="Skriv t.ex. Milda, folie, kartong eller kattbajs"><div class="hint">Sök på produkt, material, vardagsord, synonymer och vanliga stavfel.</div></header>
<div class="modebar"><button class="mode" onclick="focusSearch()">🔎 Textsökning<small>Skriv vad du har framför dig</small></button><button class="mode" onclick="startBarcode()">▣ Streckkod<small>Skanna EAN-koden på förpackningen</small></button></div>
<div id="barcode" class="barcode"><div class="barhead"><b>▣ Skanna streckkod</b><button class="clear" onclick="stopBarcode()">Stäng</button></div><div id="reader" class="reader"></div><div id="barcodeStatus" class="barstatus">Rikta kameran mot EAN-streckkoden.</div><button class="closebar" onclick="stopBarcode()">Avbryt</button></div>
<main><div class="tabs" id="tabs"></div><div id="content"></div></main><footer>Tranås Sortering 5.0 · <a href="https://tranas.se/bo-miljo-och-trafik/avfall-och-atervinning/sorteringsguiden/" target="_blank">Officiell sorteringsguide</a></footer>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let all=[],active='Alla',scanner=null,busy=false;
let fav=new Set(JSON.parse(localStorage.getItem('fav5')||'[]')),recent=JSON.parse(localStorage.getItem('recent5')||'[]');
const cats=[['Alla','♻️'],['Matavfall','🟫'],['Restavfall','⚫'],['Plastförpackning','🟨'],['Pappersförpackning','🟦'],['Metallförpackning','🟥'],['Glasförpackning','🟩'],['Tidningar','📰'],['Elektronik','🔌'],['Farligt avfall','☣️'],['Pant','💰'],['Textil/återbruk','👕'],['Norraby ÅVC','♻️'],['Apotek','💊'],['Beror på','❓']];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9åäö ]/gi,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,d[j]+1,d[j-1]+(a[i-1]===b[j-1]?0:1));d=n}return d[b.length]}
function score(x,q){let nq=norm(q);if(!nq)return 1;let qs=nq.split(' ').filter(t=>t.length>=2),best=0;for(let v of [x.name,x.category,...(x.aliases||[])]){let nv=norm(v);if(!nv)continue;if(nv===nq)best=Math.max(best,1000);if(nv.includes(nq))best=Math.max(best,180);for(let qt of qs)for(let t of nv.split(' ')){if(t===qt)best=Math.max(best,170);else if(t.startsWith(qt))best=Math.max(best,145);else if(qt.length>=4&&lev(qt,t)<=1)best=Math.max(best,120);else if(t.includes(qt)&&qt.length>=3)best=Math.max(best,110)}}return best}
async function init(){try{all=await fetch('data.json?v=5.0',{cache:'no-store'}).then(r=>r.json());renderTabs();render()}catch(e){content.innerHTML='<div class="empty">Kunde inte läsa sorteringsdatabasen.</div>'}}
function renderTabs(){tabs.innerHTML=cats.map(c=>`<button class="tab ${c[0]===active?'active':''}" onclick="active='${c[0]}';renderTabs();render()">${c[1]} ${c[0]}</button>`).join('')}
function focusSearch(){q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})}
function clearSearch(){q.value='';render();focusSearch()}
function toggleFav(i){let k=all[i].name;fav.has(k)?fav.delete(k):fav.add(k);localStorage.setItem('fav5',JSON.stringify([...fav]));render()}
function addRecent(s){if(!s)return;recent=[s,...recent.filter(x=>x.toLowerCase()!==s.toLowerCase())].slice(0,8);localStorage.setItem('recent5',JSON.stringify(recent))}
async function startBarcode(){
 barcode.style.display='block';barcodeStatus.textContent='Startar streckkodsläsaren…';
 if(typeof Html5Qrcode==='undefined'){barcodeStatus.textContent='Streckkodsläsaren kunde inte laddas. Öppna sidan med internet första gången.';return}
 try{scanner=new Html5Qrcode('reader');const cfg={fps:10,qrbox:{width:Math.min(320,Math.floor(window.innerWidth*.72)),height:130},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]};await scanner.start({facingMode:'environment'},cfg,onBarcode,()=>{});barcodeStatus.textContent='Rikta kameran mot streckkoden. Håll den rak och nära.'}
 catch(e){barcodeStatus.textContent='Kunde inte starta kameran. Kontrollera kameratillståndet i Safari.'}}
async function onBarcode(code){if(busy)return;busy=true;barcodeStatus.textContent='Hittade '+code+' – söker produkt…';try{await stopBarcode();await lookupBarcode(code)}finally{busy=false}}
async function stopBarcode(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}reader.innerHTML='';barcode.style.display='none'}
async function lookupBarcode(code){
 let local=all.find(x=>(x.barcodes||[]).map(String).includes(String(code)));
 if(local){q.value=local.name;addRecent(local.name);render();return}
 try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,generic_name,code',{cache:'no-store'}),d=await r.json();if(d.status===1&&d.product){let p=d.product,name=[p.product_name,p.brands].filter(Boolean).join(' ').trim();q.value=name||code;addRecent(q.value);render();content.insertAdjacentHTML('afterbegin',`<div class="info"><b>▣ Streckkod ${esc(code)}</b><br>Produkt hittad: <b>${esc(name||'Okänd produkt')}</b><br><small>Kontrollera gärna förpackningsmaterialet om träffen gäller en ny produkt.</small></div>`);return}}
 catch(e){}
 q.value=code;addRecent(code);render();content.insertAdjacentHTML('afterbegin',`<div class="info"><b>▣ Streckkod ${esc(code)}</b><br>Produkten finns inte i vår databas ännu. Lägg gärna till den med textsökning eller skicka produktnamnet till mig så kan vi lägga in den.</div>`)
}
function render(){let query=q.value.trim(),arr=all.map((x,i)=>({...x,i,s:query?score(x,query):1})).filter(x=>(active==='Alla'||x.category===active)&&(!query||x.s>0)).sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name,'sv'));content.innerHTML='';if(!query&&active==='Alla'){content.innerHTML=`<div class="info"><h2>Snabbsök</h2><div>Testa <b>Milda</b>, <b>Latz</b>, <b>kattmat</b>, <b>folie</b>, <b>kartong</b>, <b>batteri</b> eller <b>julklappspapper</b>.</div></div>${recent.length?`<div class="section">Senaste sökningar</div><div class="info chips">${recent.map(r=>`<button class="chip" onclick="q.value='${esc(r)}';render()">${esc(r)}</button>`).join('')}</div>`:''}<div class="info"><h2>📌 Viktig grundregel</h2><div>Det är bara <b>förpackningar</b> som ska till förpackningsfraktionerna. För en förpackning som består av flera material: sortera efter materialet den är mest av.</div></div><div class="info"><h2>♻️ Norraby ÅVC</h2><div>Tar bland annat emot grovavfall, trädgårdsavfall, elavfall och farligt avfall.</div><p><b>Ordinarie:</b> Mån 08–19 · Tis 07–16 · Ons 07–16 · Tor 08–19 · Fre 07–16 · Lör 08–15 · Sön stängt</p></div>`;return}if(query){addRecent(query)}if(!arr.length){content.innerHTML='<div class="empty"><b>Hittade inget.</b><br>Prova ett kortare ord, synonym eller streckkod.</div>';return}content.innerHTML=arr.slice(0,40).map(x=>`<div class="card ${x.category==='Beror på'?'amb':''}"><div class="icon">${x.icon||'♻️'}</div><div style="flex:1"><div class="name">${esc(x.name)}</div><div class="cat">${esc(x.category)}</div><div class="note">${esc(x.note||'')}</div></div><button class="star" onclick="toggleFav(${x.i})">${fav.has(x.name)?'⭐':'☆'}</button></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
q.addEventListener('input',render);init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=5.0',{updateViaCache:'none'});
</script></body></html>
